spring.application.name=wallet-service

server.port=8082
spring.datasource.url=jdbc:postgresql://localhost:5434/db_wallet
spring.datasource.username=wallet
spring.datasource.password=wallet

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

management.endpoints.web.exposure.include=health,info

# jwk-set-uri seul : la clé est téléchargée au premier jeton, pas au démarrage. Pas d'issuer-uri.
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8080/.well-known/jwks.json
app.jwt.issuer=http://localhost:8080

# Jamais de stack, de SQL ni de nom de classe dans une réponse d'erreur.
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.error.include-exception=false
spring.mvc.problemdetails.enabled=true

# Le jeton Bearer ne doit pas apparaître dans les journaux.
logging.level.org.springframework.security.oauth2.server.resource=warn
logging.level.org.springframework.web.client=warn

app.user-service.base-url=http://localhost:8080
app.bank.base-url=http://localhost:9081
app.bank.token-url=http://localhost:8180/realms/bank/protocol/openid-connect/token
app.bank.client-id=wallet-service
app.bank.client-secret=wallet-dev-secret
app.http.connect-timeout=2s
app.http.read-timeout=5s

