services:
  db_wallet:
    image: postgres:16
    container_name: db_wallet
    environment:
      POSTGRES_DB: db_wallet
      POSTGRES_USER: wallet
      POSTGRES_PASSWORD: wallet
    ports:
      - "5434:5432"
    volumes:
      - db_wallet_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wallet -d db_wallet"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db_wallet_data: